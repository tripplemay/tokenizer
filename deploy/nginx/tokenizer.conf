# ============================================================================
# deploysvr 宿主 nginx vhost — token.vpanel.cc（BL-PROD-MIGRATE-DEPLOYSVR）
# ============================================================================
# 直连模型：客户端/浏览器 → Cloudflare DNS（灰云 proxied=False）→ deploysvr 公网
#   80/443（本 vhost + Certbot TLS，DNS-01 证书）→ 127.0.0.1:3010（tokenizer app 容器）。
# 客户端硬编码 https://token.vpanel.cc 直连源站，故沿用 guangai 系“公网 443 + 真证书”，
#   而非 *.vpanel.cc 的 10.77.0.2:8080 隧道块。监听地址与既有块互不冲突。
#
# 依赖 conf.d/00-http-upgrade-map.conf（$proxy_connection_upgrade）。
#
# 安装：
#   cp deploy/nginx/tokenizer.conf /etc/nginx/sites-available/tokenizer.conf
#   ln -sf /etc/nginx/sites-available/tokenizer.conf /etc/nginx/sites-enabled/tokenizer.conf
#   mkdir -p /var/www/certbot
#   certbot certonly --dns-cloudflare --dns-cloudflare-credentials /root/.secrets/cloudflare.ini -d token.vpanel.cc
#   nginx -t && systemctl reload nginx
# ----------------------------------------------------------------------------

upstream tokenizer_backend {
    server 127.0.0.1:3010;
    keepalive 32; # 复用到 app 容器的连接
}

# --- HTTP: ACME challenge + 跳转 HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name token.vpanel.cc;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- token.vpanel.cc — Tokenizer 仪表盘 + 采集 API（Next.js standalone）---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name token.vpanel.cc;

    ssl_certificate     /etc/letsencrypt/live/token.vpanel.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/token.vpanel.cc/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    # 批量上传：客户端 POST /api/usage/events/batch 可能较大
    client_max_body_size 50m;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 4;
    gzip_vary on;

    # Next 构建产物：内容哈希文件名，强缓存
    location /_next/static/ {
        proxy_pass http://tokenizer_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 采集 / 仪表盘 API：关闭缓冲；authorization / x-admin-token 由 nginx 默认透传
    location /api/ {
        proxy_pass http://tokenizer_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://tokenizer_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $proxy_connection_upgrade;
    }
}
