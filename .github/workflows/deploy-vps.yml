name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run verify

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
      VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        run: |
          set -eu
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/tokenizer_vps
          chmod 600 ~/.ssh/tokenizer_vps
          ssh-keyscan -p "${VPS_SSH_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Sync files to VPS
        run: |
          set -eu
          DEPLOY_PATH="${VPS_DEPLOY_PATH:-/opt/tokenizer}"
          SSH_TARGET="$VPS_USER@$VPS_HOST"
          SSH_CMD="ssh -i ~/.ssh/tokenizer_vps -p ${VPS_SSH_PORT:-22} -o ServerAliveInterval=30 -o ServerAliveCountMax=20"
          $SSH_CMD "$SSH_TARGET" "mkdir -p '$DEPLOY_PATH'"
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='.next' \
            --exclude='node_modules' \
            -e "$SSH_CMD" \
            ./ "$SSH_TARGET:$DEPLOY_PATH/"

      - name: Deploy on VPS
        run: |
          set -eu
          DEPLOY_PATH="${VPS_DEPLOY_PATH:-/opt/tokenizer}"
          SSH_TARGET="$VPS_USER@$VPS_HOST"
          SSH_CMD="ssh -i ~/.ssh/tokenizer_vps -p ${VPS_SSH_PORT:-22} -o ServerAliveInterval=30 -o ServerAliveCountMax=20"

          if [ -z "${ADMIN_TOKEN:-}" ]; then
            echo "ADMIN_TOKEN secret is required" >&2
            exit 1
          fi

          if [ -z "${NEXT_PUBLIC_APP_URL:-}" ]; then
            NEXT_PUBLIC_APP_URL="https://token.vpanel.cc"
          fi

          ENV_FILE="$(mktemp)"
          {
            printf 'ADMIN_TOKEN=%s\n' "$ADMIN_TOKEN"
            printf 'NEXT_PUBLIC_APP_URL=%s\n' "$NEXT_PUBLIC_APP_URL"
            printf 'DATABASE_URL=postgresql://tokenizer:tokenizer@localhost:5432/tokenizer\n'
            printf 'APP_HOST_PORT=127.0.0.1:3010\n'
          } > "$ENV_FILE"
          scp -i ~/.ssh/tokenizer_vps -P "${VPS_SSH_PORT:-22}" "$ENV_FILE" "$SSH_TARGET:$DEPLOY_PATH/.env"
          rm -f "$ENV_FILE"

          $SSH_CMD "$SSH_TARGET" "cd '$DEPLOY_PATH' && docker compose build
          docker compose up -d postgres
          docker compose run --rm migrate
          docker compose up -d app
          docker compose ps"
