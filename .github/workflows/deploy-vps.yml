name: Deploy VPS

on:
  push:
    branches:
      - main
    # harness 的状态类改动不触发部署/CI。装了 harness 之后，状态机每推进一个阶段就会
    # 提交一次 progress.json —— 没有这张表的话，每一次状态推进都会重建镜像并部署生产。
    paths-ignore:
      - ".auto-memory/**"
      - ".claude/**"
      - "framework/**"
      # docs/ 全目录豁免的成立前提：运行时代码不读取 docs/（已 grep 核实 src/ app/ 零命中，
      # 引用见 docs/adr/0001）。若未来有运行时资产进 docs/，必须先收窄本行。
      - "docs/**"
      - "progress.json"
      - "features.json"
      - "backlog.json"
      - ".agents-registry.json"
      - "harness.json"
      - "harness.lock"
      - "harness-rules.md"
      - "planner.md"
      - "generator.md"
      - "evaluator.md"
      - "orchestration-patterns.md"
      - "CLAUDE.md"
      - "AGENTS.md"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      predecessor_sha:
        description: Optional distinct prior source SHA; defaults to fetched origin/main
        required: false
        type: string
      bootstrap_rehearsal:
        description: Explicit first-baseline same-SHA rehearsal only; disables production deployment
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run verify

      - name: Run unit tests
        run: npm run test

      - name: Detect contract changes
        id: contract-impact
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] ||
             [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]] ||
             ! git cat-file -e "$BASE_SHA^{commit}"; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BASE_SHA" HEAD)"
          if printf '%s\n' "$CHANGED" | rg -q '^(src/(cli|server|shared)/harness|app/api/harness/|\.claude/console/|framework/harness/|tests/contract/|scripts/ci/assert-vitest-results\.mjs$|prisma/(schema\.prisma$|migrations/)|\.github/workflows/(deploy-vps|contract-conformance)\.yml$|harness\.json$)'; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout pinned framework fixtures
        if: steps.contract-impact.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          FRAMEWORK_COMMIT="$(jq -er .framework.commit harness.json)"
          FRAMEWORK_URL="$(jq -er .framework.source_url harness.json)"
          git clone --quiet "$FRAMEWORK_URL" harness-template
          git -C harness-template checkout --quiet "$FRAMEWORK_COMMIT"
          echo "framework pinned at $(git -C harness-template rev-parse HEAD)"

      - name: Run pinned bidirectional contract tests
        if: steps.contract-impact.outputs.required == 'true'
        env:
          CONTRACT_FIXTURES_DIR: ${{ github.workspace }}/harness-template/contract-fixtures
        run: |
          mkdir -p .ci
          npx vitest run tests/contract/ --reporter=default --reporter=json --outputFile=.ci/contract-results.json
          node scripts/ci/assert-vitest-results.mjs .ci/contract-results.json 6

      - name: Next.js build smoke check
        run: npm run build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

  verify-windows:
    name: Verify (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Also the live check that better-sqlite3 resolves a win32-x64 prebuild
      # instead of falling back to node-gyp (which would need MSVC toolchain).
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run verify

      - name: Verify native Windows pinned installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .ci -Force | Out-Null
          npx vitest run tests/cli/agent-release-installer-windows.test.ts --reporter=default --reporter=json --outputFile=.ci/windows-installer.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/ci/assert-windows-installer.mjs .ci/windows-installer.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload native Windows installer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-pinned-installer
          path: .ci/windows-installer.json
          if-no-files-found: warn
          retention-days: 7

      - name: Run unit tests
        run: npm run test

      - name: Verify Windows agent owner force termination
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .ci -Force | Out-Null
          npx vitest run tests/cli/agent-lifecycle.test.ts -t "reclaims a lock after Windows force-terminates the agent" --reporter=json --outputFile=.ci/windows-agent-owner.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/ci/assert-windows-agent-owner.mjs .ci/windows-agent-owner.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows agent owner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-agent-owner
          path: .ci/windows-agent-owner.json
          if-no-files-found: warn
          retention-days: 7

      # install.ps1 cannot be parsed anywhere but Windows, so a syntax error
      # would otherwise only surface on a user's machine mid-install.
      - name: Validate install.ps1 syntax
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./public/install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host "::error::$($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          Write-Host "install.ps1 parsed cleanly"

      # No Next.js build here: the server only ever runs on Linux. This job
      # exists to guard the CLI collector, which is what users install natively.

  verify-macos-agent:
    name: Verify (macOS launchd)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run verify

      - name: Require a usable native launchd GUI domain
        run: |
          set -euo pipefail
          launchctl print "gui/$(id -u)" >/dev/null

      - name: Verify native macOS launchd pinned installer
        run: |
          set -euo pipefail
          mkdir -p .ci
          npx vitest run tests/cli/agent-release-installer-macos.test.ts --reporter=default --reporter=json --outputFile=.ci/macos-launchd-installer.json
          node scripts/ci/assert-macos-launchd-installer.mjs .ci/macos-launchd-installer.json

      - name: Upload native macOS launchd installer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-launchd-pinned-installer
          path: .ci/macos-launchd-installer.json
          if-no-files-found: error
          retention-days: 7

  verify-db:
    name: Verify (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tokenizer_ci_scratch
          POSTGRES_USER: tokenizer_ci
          POSTGRES_PASSWORD: tokenizer_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tokenizer_ci -d tokenizer_ci_scratch"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TZ: UTC
      DATABASE_URL: postgresql://tokenizer_ci:tokenizer_ci@localhost:5432/tokenizer_ci_scratch
      EVAL_B06_DB_URL: postgresql://tokenizer_ci:tokenizer_ci@localhost:5432/tokenizer_ci_scratch
      EVAL_F003_DB_URL: postgresql://tokenizer_ci:tokenizer_ci@localhost:5432/tokenizer_ci_scratch
      EVAL_F004_DB_URL: postgresql://tokenizer_ci:tokenizer_ci@localhost:5432/tokenizer_ci_scratch
      EVAL_F005_DB_URL: postgresql://tokenizer_ci:tokenizer_ci@localhost:5432/tokenizer_ci_scratch
      EVAL_F007_DB_URL: postgresql://tokenizer_ci:tokenizer_ci@localhost:5432/tokenizer_ci_scratch
      EVAL_DB_URL: postgresql://tokenizer_ci:tokenizer_ci@localhost:5432/tokenizer_ci_scratch
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply all database migrations
        run: npm run prisma:deploy

      - name: Run database integration probes without skips
        run: |
          mkdir -p .ci
          npx vitest run \
            tests/server/b06-batch-db.probe.test.ts \
            tests/server/quota-account-db.probe.test.ts \
            tests/server/harness-gates-route-db.probe.test.ts \
            tests/server/harness-cost-range-db.probe.test.ts \
            tests/evaluator/bl-cost-batch-v1-f003-cachekey-db.probe.test.ts \
            tests/evaluator/bl-security-p1-f008-probes.test.ts \
            --reporter=default --reporter=json --outputFile=.ci/db-probes.json
          node scripts/ci/assert-vitest-results.mjs .ci/db-probes.json 13

  verify-browser:
    name: Verify (authenticated browser)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tokenizer_e2e
          POSTGRES_USER: tokenizer_e2e
          POSTGRES_PASSWORD: tokenizer_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tokenizer_e2e -d tokenizer_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI_E2E: "1"
      DATABASE_URL: postgresql://tokenizer_e2e:tokenizer_e2e@localhost:5432/tokenizer_e2e
      E2E_DATABASE_URL: postgresql://tokenizer_e2e:tokenizer_e2e@localhost:5432/tokenizer_e2e
      AUTH_SECRET: ci-e2e-synthetic-auth-secret-not-for-production
      AUTH_RESEND_KEY: ci-e2e-synthetic-resend-key-not-for-production
      AUTH_TRUST_HOST: "true"
      AUTH_URL: http://127.0.0.1:3781
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3781
      PRICING_AUTO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply all database migrations
        run: npm run prisma:deploy

      - name: Build production server
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run authenticated critical journeys
        run: npm run test:e2e

      - name: Keep browser failure screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tokenizer-browser-e2e
          path: test-results/e2e/
          if-no-files-found: ignore
          retention-days: 7
  release-artifact:
    name: Linux OCI and recovery rehearsal
    runs-on: ubuntu-latest
    needs: [verify, verify-windows, verify-macos-agent, verify-db, verify-browser]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      app-image: ${{ steps.refs.outputs.app }}@${{ steps.app.outputs.digest }}
      migrate-image: ${{ steps.refs.outputs.migrate }}@${{ steps.migrate.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start isolated CI registry
        run: docker run -d --name registry -p 5000:5000 registry:2
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true
      - name: Set immutable artifact references
        id: refs
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          PREVIOUS_HINT: ${{ github.event.pull_request.base.sha || github.event.before || inputs.predecessor_sha }}
          BOOTSTRAP_REHEARSAL: ${{ inputs.bootstrap_rehearsal || false }}
          RELEASE_EVENT: ${{ github.event_name }}
          PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          repository="${REPOSITORY,,}"
          registry=localhost:5000
          if [[ "$PUBLISH" == true ]]; then registry=ghcr.io; fi
          PREVIOUS="$(bash scripts/select-release-predecessor.sh)"
          {
            echo "app=$registry/$repository-app"
            echo "migrate=$registry/$repository-migrate"
            echo "old-app=localhost:5000/rollback-app"
            echo "old-migrate=localhost:5000/rollback-migrate"
            echo "previous=$PREVIOUS"
          } >> "$GITHUB_OUTPUT"
          mkdir .baseline
          git archive "$PREVIOUS" | tar -x -C .baseline
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate app once
        id: app
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          platforms: linux/amd64
          push: true
          provenance: mode=max
          tags: ${{ steps.refs.outputs.app }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: SOURCE_COMMIT=${{ github.sha }}
      - name: Build exact migration artifact
        id: migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          platforms: linux/amd64
          push: true
          provenance: mode=max
          tags: ${{ steps.refs.outputs.migrate }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: SOURCE_COMMIT=${{ github.sha }}
      - name: Build previous source app for compatibility rehearsal
        id: old-app
        uses: docker/build-push-action@v6
        with:
          context: .baseline
          file: .baseline/Dockerfile
          target: runner
          platforms: linux/amd64
          push: true
          tags: ${{ steps.refs.outputs.old-app }}:${{ steps.refs.outputs.previous }}
          labels: org.opencontainers.image.revision=${{ steps.refs.outputs.previous }}
          build-args: SOURCE_COMMIT=${{ steps.refs.outputs.previous }}
      - name: Build previous source migration artifact
        id: old-migrate
        uses: docker/build-push-action@v6
        with:
          context: .baseline
          file: .baseline/Dockerfile
          target: builder
          platforms: linux/amd64
          push: true
          tags: ${{ steps.refs.outputs.old-migrate }}:${{ steps.refs.outputs.previous }}
          labels: org.opencontainers.image.revision=${{ steps.refs.outputs.previous }}
          build-args: SOURCE_COMMIT=${{ steps.refs.outputs.previous }}
      - name: Attest app digest from this workflow
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.refs.outputs.app }}
          subject-digest: ${{ steps.app.outputs.digest }}
          push-to-registry: true
      - name: Attest migration digest from this workflow
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.refs.outputs.migrate }}
          subject-digest: ${{ steps.migrate.outputs.digest }}
          push-to-registry: true
      - name: Verify signed provenance and exact source revision
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_IMAGE: ${{ steps.refs.outputs.app }}@${{ steps.app.outputs.digest }}
          MIGRATE_IMAGE: ${{ steps.refs.outputs.migrate }}@${{ steps.migrate.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p .releases
          wrong_source=0000000000000000000000000000000000000000
          for kind in app migrate; do
            if [[ "$kind" == app ]]; then image="$APP_IMAGE"; else image="$MIGRATE_IMAGE"; fi
            gh attestation verify "oci://$image" --repo "$GITHUB_REPOSITORY" \
              --source-digest "$GITHUB_SHA" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/deploy-vps.yml" \
              --format json > ".releases/$GITHUB_SHA.$kind.provenance.json"
            if gh attestation verify "oci://$image" --repo "$GITHUB_REPOSITORY" \
              --source-digest "$wrong_source" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/deploy-vps.yml" >/dev/null 2>&1; then
              echo "wrong source SHA unexpectedly passed attestation verification" >&2; exit 1
            fi
            if gh attestation verify "oci://$image" --repo "$GITHUB_REPOSITORY" \
              --source-digest "$GITHUB_SHA" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/not-release.yml" >/dev/null 2>&1; then
              echo "wrong signer workflow unexpectedly passed attestation verification" >&2; exit 1
            fi
            printf 'wrong_source=rejected\nwrong_workflow=rejected\n' > ".releases/$GITHUB_SHA.$kind.provenance-negative-controls"
          done
      - name: Backup restore migration and old-image business rehearsal
        env:
          REHEARSAL_MODE: synthetic
          EXPECTED_SHA: ${{ github.sha }}
          APP_IMAGE: ${{ steps.refs.outputs.app }}@${{ steps.app.outputs.digest }}
          MIGRATE_IMAGE: ${{ steps.refs.outputs.migrate }}@${{ steps.migrate.outputs.digest }}
          PREVIOUS_APP_IMAGE: ${{ steps.refs.outputs.old-app }}@${{ steps.old-app.outputs.digest }}
          PREVIOUS_MIGRATE_IMAGE: ${{ steps.refs.outputs.old-migrate }}@${{ steps.old-migrate.outputs.digest }}
          PREVIOUS_SHA: ${{ steps.refs.outputs.previous }}
        run: |
          set -euo pipefail
          docker pull "$APP_IMAGE"
          docker pull "$MIGRATE_IMAGE"
          bash scripts/test/rehearse-release.sh
      - name: Stage allowlisted synthetic recovery evidence
        env:
          REQUIRE_PROVENANCE: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: node scripts/ci/recovery-evidence.mjs stage .releases "$GITHUB_SHA" "$REQUIRE_PROVENANCE" release-recovery-evidence
      - name: Retain synthetic recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-recovery-${{ github.sha }}
          path: release-recovery-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Download retained synthetic recovery evidence
        uses: actions/download-artifact@v4
        with:
          name: release-recovery-${{ github.sha }}
          path: release-recovery-downloaded
      - name: Verify downloaded recovery evidence manifest and hashes
        env:
          REQUIRE_PROVENANCE: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: node scripts/ci/recovery-evidence.mjs verify release-recovery-downloaded "$GITHUB_SHA" "$REQUIRE_PROVENANCE"
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # This single main-push workflow deploys a repository that also ships the
    # Windows CLI; a failing native-agent gate must block this release path.
    permissions:
      contents: read
      packages: read
      attestations: read
    needs: [verify, verify-windows, verify-macos-agent, verify-db, verify-browser, release-artifact]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && inputs.bootstrap_rehearsal != true
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
      VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      APP_IMAGE: ${{ needs.release-artifact.outputs.app-image }}
      MIGRATE_IMAGE: ${{ needs.release-artifact.outputs.migrate-image }}
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REGISTRY_USER: ${{ github.actor }}
      # Auth.js v5 — sign-in / session secrets. AUTH_SECRET and
      # AUTH_RESEND_KEY come from GitHub Actions secrets (set them in repo
      # Settings → Secrets and variables → Actions). AUTH_TRUST_HOST and
      # AUTH_EMAIL_FROM are hardcoded sane defaults below.
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      AUTH_RESEND_KEY: ${{ secrets.AUTH_RESEND_KEY }}
      # harness 闸门决策签名私钥。**存的是 PEM 的 base64**（单行）——.env 不支持多行值，
      # PEM 原文只会被读到第一行。生成：
      #   bash .claude/console/gen-console-key.sh /tmp/k && base64 -i /tmp/k/console.key | tr -d '\n'
      HARNESS_CONSOLE_SIGNING_KEY: ${{ secrets.HARNESS_CONSOLE_SIGNING_KEY }}
      # Auto-pricing (all optional; feature ships off). Toggle/URLs live in repo
      # Variables; the LLM-fallback key is a Secret.
      PRICING_AUTO_ENABLED: ${{ vars.PRICING_AUTO_ENABLED }}
      LITELLM_PRICES_URL: ${{ vars.LITELLM_PRICES_URL }}
      OPENROUTER_MODELS_URL: ${{ vars.OPENROUTER_MODELS_URL }}
      PRICING_LLM_BASE_URL: ${{ vars.PRICING_LLM_BASE_URL }}
      PRICING_LLM_MODEL: ${{ vars.PRICING_LLM_MODEL }}
      PRICING_LLM_KEY: ${{ secrets.PRICING_LLM_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        run: bash scripts/validate-deploy-secrets.sh

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Independently verify artifact provenance before SSH
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for image in "$APP_IMAGE" "$MIGRATE_IMAGE"; do
            gh attestation verify "oci://$image" --repo "$GITHUB_REPOSITORY" \
              --source-digest "$GITHUB_SHA" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/deploy-vps.yml"
          done

      - name: Prepare SSH
        run: |
          set -eu
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/tokenizer_vps
          chmod 600 ~/.ssh/tokenizer_vps
          ssh-keyscan -p "${VPS_SSH_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Sync files to VPS
        run: |
          set -eu
          DEPLOY_PATH="${VPS_DEPLOY_PATH:-/opt/tokenizer}"
          SSH_TARGET="$VPS_USER@$VPS_HOST"
          SSH_CMD="ssh -i ~/.ssh/tokenizer_vps -p ${VPS_SSH_PORT:-22} -o ServerAliveInterval=30 -o ServerAliveCountMax=20"
          $SSH_CMD "$SSH_TARGET" "mkdir -p '$DEPLOY_PATH'"
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='.releases' \
            --exclude='.baseline' \
            --exclude='.next' \
            --exclude='node_modules' \
            -e "$SSH_CMD" \
            ./ "$SSH_TARGET:$DEPLOY_PATH/"

      - name: Deploy on VPS
        run: |
          set -eu
          DEPLOY_PATH="${VPS_DEPLOY_PATH:-/opt/tokenizer}"
          SSH_TARGET="$VPS_USER@$VPS_HOST"
          SSH_CMD="ssh -i ~/.ssh/tokenizer_vps -p ${VPS_SSH_PORT:-22} -o ServerAliveInterval=30 -o ServerAliveCountMax=20"

          umask 077
          ENV_FILE="$(mktemp)"
          trap 'rm -f "$ENV_FILE"; $SSH_CMD "$SSH_TARGET" "docker logout ghcr.io" >/dev/null 2>&1 || true' EXIT
          # Short-lived CI registry credential through stdin, not argv or .env.
          printf '%s' "$REGISTRY_TOKEN" | $SSH_CMD "$SSH_TARGET" "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin"
          {
            printf 'ADMIN_TOKEN=%s\n' "$ADMIN_TOKEN"
            printf 'NEXT_PUBLIC_APP_URL=%s\n' "$NEXT_PUBLIC_APP_URL"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'DATABASE_URL=postgresql://tokenizer:%s@localhost:5432/tokenizer\n' "$POSTGRES_PASSWORD"
            printf 'APP_HOST_PORT=127.0.0.1:3010\n'
            printf 'GIT_COMMIT=%s\n' "${{ github.sha }}"
            printf 'APP_IMAGE=%s\n' "$APP_IMAGE"
            printf 'MIGRATE_IMAGE=%s\n' "$MIGRATE_IMAGE"
            # Auth.js v5
            printf 'AUTH_SECRET=%s\n' "${AUTH_SECRET:-}"
            printf 'AUTH_TRUST_HOST=true\n'
            printf 'AUTH_URL=%s\n' "$NEXT_PUBLIC_APP_URL"
            printf 'AUTH_RESEND_KEY=%s\n' "${AUTH_RESEND_KEY:-}"
            printf 'AUTH_EMAIL_FROM=noreply@token.vpanel.cc\n'
            # harness 人闸门签名私钥（PEM 的 base64，单行——.env 放不下多行 PEM）
            printf 'HARNESS_CONSOLE_SIGNING_KEY=%s\n' "${HARNESS_CONSOLE_SIGNING_KEY:-}"
            # Auto-pricing (feature ships off unless PRICING_AUTO_ENABLED=1)
            printf 'PRICING_AUTO_ENABLED=%s\n' "${PRICING_AUTO_ENABLED:-0}"
            printf 'LITELLM_PRICES_URL=%s\n' "${LITELLM_PRICES_URL:-}"
            printf 'OPENROUTER_MODELS_URL=%s\n' "${OPENROUTER_MODELS_URL:-}"
            printf 'PRICING_LLM_BASE_URL=%s\n' "${PRICING_LLM_BASE_URL:-}"
            printf 'PRICING_LLM_KEY=%s\n' "${PRICING_LLM_KEY:-}"
            printf 'PRICING_LLM_MODEL=%s\n' "${PRICING_LLM_MODEL:-}"
          } > "$ENV_FILE"
          # Preserve the previous runtime configuration for an operator-led
          # rollback. Do not print or overwrite it on a same-SHA retry.
          $SSH_CMD "$SSH_TARGET" "umask 077; mkdir -p '$DEPLOY_PATH/.releases'; chmod 700 '$DEPLOY_PATH/.releases'; if [ -f '$DEPLOY_PATH/.env' ] && [ ! -e '$DEPLOY_PATH/.releases/${{ github.sha }}.previous-env' ]; then cp '$DEPLOY_PATH/.env' '$DEPLOY_PATH/.releases/${{ github.sha }}.previous-env'; fi"
          scp -i ~/.ssh/tokenizer_vps -P "${VPS_SSH_PORT:-22}" "$ENV_FILE" "$SSH_TARGET:$DEPLOY_PATH/.env"

          $SSH_CMD "$SSH_TARGET" "cd '$DEPLOY_PATH' && chmod 600 .env && EXPECTED_SHA='${{ github.sha }}' bash scripts/deploy-vps-release.sh"
