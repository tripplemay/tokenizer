name: Contract Conformance

# BL-REPO-MECH F002：双仓契约一致性守门。
# checkout harness-template @ harness.json 钉住的框架 commit，对其 contract-fixtures
# 跑双向契约测试（tests/contract/）。协议改动的 Deploy VPS verify 也会跑
# 相同的锁定契约测试并阻止失败部署；本工作流保留独立可观察的契约结果。

on:
  push:
    branches: [main]
    paths:
      - src/server/harness-*
      - src/cli/harness*
      - src/shared/harness*
      - app/api/harness/**
      - .claude/console/**
      - harness.json
      - prisma/schema.prisma
      - prisma/migrations/**
      - tests/contract/**
      - scripts/ci/assert-vitest-results.mjs
      - .github/workflows/contract-conformance.yml
  pull_request:
    branches: [main]
    paths:
      - src/server/harness-*
      - src/cli/harness*
      - src/shared/harness*
      - app/api/harness/**
      - .claude/console/**
      - harness.json
      - prisma/schema.prisma
      - prisma/migrations/**
      - tests/contract/**
      - scripts/ci/assert-vitest-results.mjs
      - .github/workflows/contract-conformance.yml
  workflow_dispatch: {}

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Checkout harness-template at the pinned framework commit
        run: |
          set -euo pipefail
          FRAMEWORK_COMMIT="$(jq -r .framework.commit harness.json)"
          FRAMEWORK_URL="$(jq -r .framework.source_url harness.json)"
          # harness.json 记录的是短 sha：必须完整 clone 后 checkout，
          # actions/checkout 的 ref 不接受短 sha。
          git clone --quiet "$FRAMEWORK_URL" harness-template
          git -C harness-template checkout --quiet "$FRAMEWORK_COMMIT"
          echo "framework pinned at $(git -C harness-template rev-parse HEAD)"
      - run: npm ci
      - run: npx prisma generate
      - name: Run bidirectional contract tests against the pinned fixtures
        env:
          CONTRACT_FIXTURES_DIR: ${{ github.workspace }}/harness-template/contract-fixtures
        run: |
          mkdir -p .ci
          npx vitest run tests/contract/ --reporter=default --reporter=json --outputFile=.ci/contract-results.json
          node scripts/ci/assert-vitest-results.mjs .ci/contract-results.json 6
