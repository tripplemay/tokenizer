<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>harness console</title>
<style>
  :root{
    --ground:#f3f6f6; --panel:#fff; --panel-2:#eef2f2; --ink:#132120; --ink-dim:#5c6b6a;
    --line:#dce2e2; --accent:#0e8f88; --accent-soft:#d6ecea;
    --ok:#1f9d57; --warn:#bd830f; --bad:#cf3f54; --idle:#7b8a90;
    --shadow:0 1px 2px rgba(16,40,38,.06),0 8px 24px rgba(16,40,38,.05);
    --font-ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,"PingFang SC",sans-serif;
    --font-mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{ --ground:#0c1312; --panel:#121d1c; --panel-2:#1a2726; --ink:#e6efed; --ink-dim:#8ba09e;
      --line:#25332f; --accent:#3ecfc4; --accent-soft:#152f2c;
      --ok:#3ecf7a; --warn:#e0a83a; --bad:#ee6b7e; --idle:#6e817f;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-ui);
       font-size:14px;line-height:1.5;padding:20px}
  .wrap{max-width:1180px;margin:0 auto}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  h1{font-size:17px;margin:0;letter-spacing:.2px}
  .sub{color:var(--ink-dim);font-size:12px;font-family:var(--font-mono)}
  button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);
         border-radius:7px;padding:5px 11px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.danger{border-color:var(--bad);color:var(--bad)}
  button:disabled{opacity:.5;cursor:not-allowed}
  section{margin-bottom:24px}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--ink-dim);
     margin:0 0 10px;font-weight:600}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;
        box-shadow:var(--shadow);padding:14px 16px;margin-bottom:10px}
  .gate{border-left:4px solid var(--warn)}
  .gate.decided{border-left-color:var(--ok);opacity:.72}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .spread{justify-content:space-between}
  .chip{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--panel-2);
        color:var(--ink-dim);font-family:var(--font-mono)}
  .chip.ok{background:var(--accent-soft);color:var(--accent)}
  .chip.warn{color:var(--warn)} .chip.bad{color:var(--bad)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
  .mono{font-family:var(--font-mono);font-size:12px}
  .dim{color:var(--ink-dim)}
  .detail{margin:8px 0;color:var(--ink)}
  .pipe{display:flex;gap:3px;margin:8px 0 4px;flex-wrap:wrap}
  .node{font-size:10px;padding:2px 7px;border-radius:5px;background:var(--panel-2);color:var(--idle);
        font-family:var(--font-mono)}
  .node.cur{background:var(--accent);color:#fff}
  .node.done{background:var(--accent-soft);color:var(--accent)}
  .bar{height:5px;background:var(--panel-2);border-radius:3px;overflow:hidden;margin:8px 0 4px}
  .bar>i{display:block;height:100%;background:var(--accent)}
  input,textarea{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--ground);
        color:var(--ink);border-radius:7px;padding:5px 9px}
  .ev{margin-top:8px}
  .ev button{font-size:11px;padding:3px 8px}
  pre{background:var(--panel-2);border-radius:8px;padding:10px;overflow-x:auto;
      font-family:var(--font-mono);font-size:11.5px;max-height:340px;margin:8px 0 0}
  .empty{color:var(--ink-dim);font-size:13px;padding:8px 2px}
  .err{color:var(--bad);font-size:12px}
  .toast{position:fixed;right:16px;bottom:16px;background:var(--panel);border:1px solid var(--line);
         border-left:4px solid var(--accent);border-radius:9px;padding:10px 14px;box-shadow:var(--shadow);
         max-width:min(420px,90vw);font-size:13px}
  .toast.bad{border-left-color:var(--bad)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>harness console</h1>
    <span class="sub" id="meta">加载中…</span>
    <span style="flex:1"></span>
    <label class="sub"><input type="checkbox" id="auto" checked> 自动刷新</label>
    <button id="refresh">刷新</button>
  </header>

  <section>
    <h2>待批闸门</h2>
    <div id="gates"></div>
  </section>

  <section>
    <h2>项目</h2>
    <div class="grid" id="projects"></div>
  </section>
</div>

<script>
const PHASES = ["new","planning","building","verifying","fixing","reverifying","done"];
const KIND_LABEL = {
  phase_advance:"阶段推进", l2_auth:"L2 授权", adjudication:"规格裁决",
  debias_conflict:"去偏分歧", scope_drift:"越界稽核", budget:"预算触顶",
  spec_lock:"待锁 spec", other:"其他"
};
const token = new URLSearchParams(location.search).get("token") || "";
const q = p => token ? (p + (p.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(token)) : p;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(msg, bad){
  const d = document.createElement("div");
  d.className = "toast" + (bad ? " bad" : "");
  d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 5200);
}

async function api(path, opts){
  const r = await fetch(q(path), Object.assign({headers:{"Content-Type":"application/json"}}, opts||{}));
  const j = await r.json().catch(() => ({error:"响应不是 JSON"}));
  if(!r.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}

function gateCard(proj, g){
  const decided = !!g.decision;
  const ev = (g.evidence||[]).map(p =>
    `<button data-ev="${esc(p)}" data-proj="${esc(proj)}">查看 ${esc(p.split("/").pop())}</button>`).join(" ");
  return `<div class="card gate ${decided?"decided":""}">
    <div class="row spread">
      <div class="row">
        <strong>${esc(proj)}</strong>
        <span class="chip warn">${esc(KIND_LABEL[g.kind]||g.kind)}</span>
        <span class="chip">${esc(g.batch)}</span>
        ${g.from_status?`<span class="chip mono">${esc(g.from_status)} → ${esc(g.to_status||"—")}</span>`:""}
      </div>
      <span class="sub dim">${esc(g.raised_at)} · ${esc(g.raised_by)}</span>
    </div>
    <div class="detail">${esc(g.detail)}</div>
    <div class="mono dim">${esc(g.id)}</div>
    ${ev?`<div class="ev">${ev}</div>`:""}
    <div class="ev" data-out></div>
    ${decided
      ? `<div class="row" style="margin-top:10px"><span class="chip ok">已${g.decision.action==="approve"?"批准":"驳回"}</span>
         <span class="sub dim">by ${esc(g.decision.by)} · ${esc(g.decision.at)}${g.decision.note?" · "+esc(g.decision.note):""}</span>
         <span class="sub dim">等机器侧 pull 后生效</span></div>`
      : `<div class="row" style="margin-top:10px">
           <input placeholder="备注（可选）" data-note style="flex:1;min-width:180px">
           <button class="primary" data-act="approve" data-proj="${esc(proj)}" data-gid="${esc(g.id)}">批准</button>
           <button class="danger" data-act="reject" data-proj="${esc(proj)}" data-gid="${esc(g.id)}">驳回</button>
         </div>`}
  </div>`;
}

function projCard(p){
  if(!p.ok) return `<div class="card"><div class="row spread"><strong>${esc(p.name)}</strong>
    <span class="chip bad">读取失败</span></div><div class="err">${esc(p.error)}</div></div>`;
  const pct = p.total ? Math.round(p.completed / p.total * 100) : 0;
  const idx = PHASES.indexOf(p.status);
  const pipe = PHASES.map((s,i) =>
    `<span class="node ${s===p.status?"cur":(i<idx?"done":"")}">${s}</span>`).join("");
  return `<div class="card">
    <div class="row spread">
      <strong>${esc(p.name)}</strong>
      <span class="row">
        ${p.autonomy_status?`<span class="chip ${p.autonomy_status==="running"?"ok":"warn"}">autodrive:${esc(p.autonomy_status)}</span>`:""}
        ${p.gate?`<span class="chip warn">待批闸门</span>`:""}
        <span class="chip mono">${esc(p.head||"")}</span>
      </span>
    </div>
    <div class="row" style="margin-top:4px">
      <span class="chip">${esc(p.batch||"（无批次）")}</span>
      <span class="chip ${p.status==="done"?"ok":""}">${esc(p.status||"—")}</span>
      ${p.fix_rounds?`<span class="chip warn">fix ×${p.fix_rounds}</span>`:""}
      ${p.signoff?`<span class="chip ok">已签收</span>`:""}
    </div>
    <div class="pipe">${pipe}</div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="sub dim">${p.completed}/${p.total} features · ${pct}%
      ${p.dashboard_url?` · <a href="${esc(p.dashboard_url)}" target="_blank" rel="noopener">看板</a>`:""}</div>
    ${p.last_halt?`<div class="err" style="margin-top:6px">halt: ${esc(p.last_halt.condition||"")} — ${esc(p.last_halt.detail||"")}</div>`:""}
  </div>`;
}

async function render(refresh){
  try{
    const s = await api("/api/state" + (refresh ? "?refresh=1" : ""));
    const gates = [];
    for(const p of s.projects) if(p.ok && p.gate) gates.push([p.name, p.gate]);
    document.getElementById("gates").innerHTML =
      gates.length ? gates.map(([n,g]) => gateCard(n,g)).join("")
                   : `<div class="empty">没有待批闸门 —— 所有项目要么在跑，要么已停在人这一侧之外。</div>`;
    document.getElementById("projects").innerHTML = s.projects.map(projCard).join("");
    document.getElementById("meta").textContent =
      `${s.projects.length} 个项目 · 刷新于 ${s.refreshed_at || "—"}`;
  }catch(e){ toast("加载失败：" + e.message, true); }
}

document.addEventListener("click", async ev => {
  const b = ev.target.closest("button"); if(!b) return;

  if(b.dataset.ev){
    const out = b.closest(".card").querySelector("[data-out]");
    out.innerHTML = "<span class='sub dim'>读取中…</span>";
    try{
      const r = await api(`/api/evidence?project=${encodeURIComponent(b.dataset.proj)}&path=${encodeURIComponent(b.dataset.ev)}`);
      out.innerHTML = `<pre>${esc(r.content)}</pre>`;
    }catch(e){ out.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
    return;
  }

  if(b.dataset.act){
    const card = b.closest(".card");
    const note = (card.querySelector("[data-note]")||{}).value || "";
    const label = b.dataset.act === "approve" ? "批准" : "驳回";
    if(!confirm(`确认${label}闸门 ${b.dataset.gid}？\n\n这会向该项目提交一个 commit；机器侧 pull 到后即生效。`)) return;
    card.querySelectorAll("button").forEach(x => x.disabled = true);
    try{
      const r = await api("/api/gate", {method:"POST", body:JSON.stringify({
        project:b.dataset.proj, gate_id:b.dataset.gid, action:b.dataset.act, note})});
      toast(`已${label}，commit 完成${r.pushed?"，已 push":"（push 失败，需人工推送）"}`);
      render(false);
    }catch(e){
      toast("失败：" + e.message, true);
      card.querySelectorAll("button").forEach(x => x.disabled = false);
    }
    return;
  }

  if(b.id === "refresh"){ b.disabled = true; await render(true); b.disabled = false; }
});

setInterval(() => { if(document.getElementById("auto").checked) render(false); }, 10000);
render(false);
</script>
</body>
</html>
