services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tokenizer
      POSTGRES_USER: tokenizer
      POSTGRES_PASSWORD: tokenizer
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokenizer -d tokenizer"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      target: builder
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tokenizer:tokenizer@postgres:5432/tokenizer
    command: ["npx", "prisma", "migrate", "deploy"]

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tokenizer:tokenizer@postgres:5432/tokenizer
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
    ports:
      - "${APP_HOST_PORT:-127.0.0.1:3010}:3000"

volumes:
  postgres-data:
