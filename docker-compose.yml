services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tokenizer
      POSTGRES_USER: tokenizer
      POSTGRES_PASSWORD: tokenizer
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokenizer -d tokenizer"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      target: builder
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tokenizer:tokenizer@postgres:5432/tokenizer
    command: ["npx", "prisma", "migrate", "deploy"]

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tokenizer:tokenizer@postgres:5432/tokenizer
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      # Auth.js v5 — values are passed in via the deploy workflow's .env file.
      # See .github/workflows/deploy-vps.yml for the source of truth.
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_RESEND_KEY: ${AUTH_RESEND_KEY:-}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-noreply@token.vpanel.cc}
      # harness 闸门决策的 Ed25519 签名私钥（**PEM 的 base64**，见 harness-sign.ts）。
      # 不配则批准接口 fail-closed 返回 503——闸门宁可卡住，也不签发无法验证来源的批准。
      HARNESS_CONSOLE_SIGNING_KEY: ${HARNESS_CONSOLE_SIGNING_KEY:-}
      # Auto-pricing. Detection always runs; PRICING_AUTO_ENABLED gates the
      # outbound LiteLLM/OpenRouter/LLM lookups (ships off — dark launch).
      PRICING_AUTO_ENABLED: ${PRICING_AUTO_ENABLED:-0}
      LITELLM_PRICES_URL: ${LITELLM_PRICES_URL:-}
      OPENROUTER_MODELS_URL: ${OPENROUTER_MODELS_URL:-}
      PRICING_LLM_BASE_URL: ${PRICING_LLM_BASE_URL:-}
      PRICING_LLM_KEY: ${PRICING_LLM_KEY:-}
      PRICING_LLM_MODEL: ${PRICING_LLM_MODEL:-}
    ports:
      - "${APP_HOST_PORT:-127.0.0.1:3010}:3000"

volumes:
  postgres-data:
